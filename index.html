<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CME 7-Day GEO Impact Timeline</title>
<style>
body{margin:0;background:#080a0f;color:#eee;font-family:system-ui,sans-serif}
header{padding:16px;background:#121722;border-bottom:1px solid #333}
button{padding:10px 14px;margin:4px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:16px}
.card{background:#151a24;border:1px solid #333;border-radius:14px;padding:14px}
.box{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:12px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
input[type=range]{width:100%}
pre{background:#050608;border-radius:10px;padding:10px;white-space:pre-wrap;max-height:280px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #333;padding:6px;text-align:left}
.small{font-size:13px;color:#bbb;line-height:1.5}
</style>
</head>
<body>

<header>
<h2>CME → GEO Longitude Impact Timeline</h2>
<button onclick="loadAll()">CACTus + NOAA 太陽風を取得</button>
<button onclick="playTimeline()">▶ 再生</button>
<button onclick="stopTimeline()">停止</button>
</header>

<main>

<section class="card">
<h3>7日間タイムスライダー</h3>
<input id="timeSlider" type="range" min="0" max="168" value="0" step="1" oninput="updateTimeView()">
<div id="timeLabel" class="small"></div>
</section>

<div class="grid">
<section class="card">
<h3>① CME方向</h3>
<div class="box"><canvas id="cmeCanvas"></canvas></div>
<div id="cmeSummary" class="small"></div>
</section>

<section class="card">
<h3>② GEO経度別リスク</h3>
<div class="box"><canvas id="geoCanvas"></canvas></div>
<div id="geoSummary" class="small"></div>
</section>
</div>

<section class="card" style="margin-top:16px">
<h3>CME一覧</h3>
<div id="table"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>Status</h3>
<pre id="raw">未取得</pre>
</section>

</main>

<script>
const CACTUS_URL =
"https://www.sidc.be/cactus/catalog/LASCO/2_5_0/qkl/2026/05/latestCMEs.html";

const NOAA = {
  plasma:"https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json",
  mag:"https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json",
  kp:"https://services.swpc.noaa.gov/products/noaa-estimated-planetary-k-index-1-minute.json"
};

let GLOBAL = {
  cmes: [],
  sw: {},
  startTime: new Date(),
  timer: null
};

async function fetchTextWithFallback(url){
  try{
    const r = await fetch(url + "?t=" + Date.now());
    if(!r.ok) throw new Error(r.status);
    return await r.text();
  }catch(e){
    const proxy = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);
    const r = await fetch(proxy);
    if(!r.ok) throw new Error("CACTus取得失敗。CORSの可能性あり。");
    return await r.text();
  }
}

async function fetchJson(url){
  const r = await fetch(url + "?t=" + Date.now());
  if(!r.ok) throw new Error(url);
  return await r.json();
}

async function loadAll(){
  raw("取得中...");

  const [html, plasma, mag, kp] = await Promise.all([
    fetchTextWithFallback(CACTUS_URL),
    fetchJson(NOAA.plasma).catch(()=>[]),
    fetchJson(NOAA.mag).catch(()=>[]),
    fetchJson(NOAA.kp).catch(()=>[])
  ]);

  const cmes = parseCactus(html);
  const sw = parseSolarWind(plasma, mag, kp);

  GLOBAL.startTime = new Date();
  GLOBAL.sw = sw;
  GLOBAL.cmes = cmes
    .map(c => modelCME(c, sw))
    .sort((a,b)=>b.impactScore-a.impactScore);

  drawCME(GLOBAL.cmes);
  renderTable(GLOBAL.cmes);
  updateTimeView();

  raw(JSON.stringify({
    startTime: GLOBAL.startTime.toISOString(),
    solarWind: sw,
    cmes: GLOBAL.cmes.slice(0,20)
  }, null, 2));
}

function parseCactus(html){
  const text = html.replace(/<[^>]+>/g," ");
  const lines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const cmes = [];

  for(const line of lines){
    const m = line.match(
      /^(\d+)\s*\|\s*([\d\/]+\s+\d{2}:\d{2})\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([\d.]+)\s*\|\s*([IVX-]*)/
    );
    if(!m) continue;

    cmes.push({
      id:m[1],
      t0:m[2],
      dt0:+m[3],
      pa:+m[4],
      da:+m[5],
      v:+m[6],
      dv:+m[7],
      minv:+m[8],
      maxv:+m[9],
      halo:m[10] || ""
    });
  }
  return cmes;
}

function parseSolarWind(plasma, mag, kp){
  const p = latestDataRow(plasma);
  const b = latestDataRow(mag);
  const k = latestDataRow(kp);

  const speed = +(p?.[2] || 0);
  const density = +(p?.[1] || 0);
  const temp = +(p?.[3] || 0);

  const by = +(b?.[2] || 0);
  const bz = +(b?.[3] || 0);
  const bt = +(b?.[6] || 0);

  const kpVal = +(k?.[1] || 0);
  const pdyn = density && speed ? 1.6726e-6 * density * speed * speed : 0;

  return {speed,density,temp,bt,by,bz,kp:kpVal,dynamicPressure:pdyn,time:p?.[0]||""};
}

function latestDataRow(arr){
  if(!Array.isArray(arr)) return null;
  for(let i=arr.length-1;i>=0;i--){
    if(Array.isArray(arr[i]) && !String(arr[i][0]).toLowerCase().includes("time")) return arr[i];
  }
  return null;
}

function modelCME(c, sw){
  const haloScore =
    c.halo==="IV" ? 45 :
    c.halo==="III" ? 35 :
    c.halo==="II" ? 22 :
    c.da>=90 ? 18 : 0;

  const widthScore = Math.min(30, c.da/4);
  const speedScore = c.v>=1500 ? 35 : c.v>=1000 ? 28 : c.v>=700 ? 18 : c.v>=500 ? 10 : 3;
  const earthwardScore = earthwardFromPA(c.pa, c.da);

  const shockBoost = sw.dynamicPressure>=8 ? 15 : sw.dynamicPressure>=4 ? 8 : 0;
  const bzBoost = sw.bz<=-10 ? 18 : sw.bz<=-5 ? 10 : 0;
  const kpBoost = sw.kp>=6 ? 15 : sw.kp>=5 ? 9 : 0;

  const impactScore = Math.min(100, Math.round(
    haloScore + widthScore + speedScore + earthwardScore + shockBoost + bzBoost + kpBoost
  ));

  const arrival = estimateArrival(c);

  return {
    ...c,
    impactScore,
    arrival,
    durationHours: durationByCME(c),
    activeStart: new Date(arrival.date.getTime() - 6*3600*1000),
    activeEnd: new Date(arrival.date.getTime() + durationByCME(c)*3600*1000)
  };
}

function earthwardFromPA(pa, da){
  if(da>=270) return 35;
  if(da>=180) return 28;
  if(da>=90) return 15;
  return 5;
}

function estimateArrival(c){
  const auKm = 149597870;
  let vEff = c.v;

  if(c.v > 450) vEff = 450 + (c.v - 450) * 0.62;
  if(c.v < 350) vEff = 350;

  const hours = auKm / vEff / 3600;
  const t0 = parseCactusTime(c.t0);
  const arr = new Date(t0.getTime() + hours*3600*1000);

  return {
    hours:Math.round(hours),
    date:arr,
    utc:arr.toISOString(),
    subsolarLon:subsolarLongitude(arr)
  };
}

function durationByCME(c){
  if(c.da >= 270) return 48;
  if(c.da >= 180) return 36;
  if(c.da >= 90) return 24;
  return 12;
}

function parseCactusTime(s){
  const m=s.match(/(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
  if(!m) return new Date();
  return new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5]));
}

function subsolarLongitude(date){
  const h = date.getUTCHours() + date.getUTCMinutes()/60;
  let lon = 180 - h*15;
  while(lon>180) lon-=360;
  while(lon<-180) lon+=360;
  return lon;
}

function updateTimeView(){
  const h = +document.getElementById("timeSlider").value;
  const t = new Date(GLOBAL.startTime.getTime() + h*3600*1000);

  document.getElementById("timeLabel").innerHTML =
    `<b>${t.toISOString().slice(0,16).replace("T"," ")} UTC</b> / 現在+${h}時間`;

  drawGEO(GLOBAL.cmes, GLOBAL.sw, t);
}

function setup(id){
  const c=document.getElementById(id), dpr=devicePixelRatio||1, rct=c.getBoundingClientRect();
  c.width=rct.width*dpr; c.height=rct.height*dpr;
  const ctx=c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:rct.width,h:rct.height,cx:rct.width/2,cy:rct.height/2,r:Math.min(rct.width,rct.height)*.38};
}

function drawCME(cmes){
  const {ctx,w,h,cx,cy,r}=setup("cmeCanvas");
  ctx.clearRect(0,0,w,h);

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle="#ffb300";
  ctx.fill();
  ctx.strokeStyle="#fff5";
  ctx.stroke();

  cmes.slice(0,15).forEach(c=>{
    const a = (c.pa-90)*Math.PI/180;
    const half = c.da*Math.PI/360;
    const col = riskColor(c.impactScore);

    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,r*1.2,a-half,a+half);
    ctx.closePath();
    ctx.fillStyle=col+"44";
    ctx.fill();

    const x=cx+Math.cos(a)*r*.85;
    const y=cy+Math.sin(a)*r*.85;
    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(x,y,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";
    ctx.fillText("CME"+c.id,x+8,y);
  });

  document.getElementById("cmeSummary").innerHTML =
    `CME数: <b>${cmes.length}</b><br>` +
    `扇形: CACTus PA/DA、色: Impact Score`;
}

function drawGEO(cmes, sw, time){
  const {ctx,w,h}=setup("geoCanvas");
  ctx.clearRect(0,0,w,h);

  const active = cmes.filter(c => time >= c.activeStart && time <= c.activeEnd);
  const center = subsolarLongitude(time);

  for(let i=0;i<360;i++){
    const lon = -180 + i;
    let risk = 0;

    for(const c of active){
      const dt = Math.abs(time - c.arrival.date) / 3600000;
      const timeWeight = Math.exp(-(dt*dt)/(2*18*18));

      const daysideDist = angDist(lon, center);
      const compression = Math.exp(-(daysideDist*daysideDist)/(2*55*55));

      const duskCenter = center - 90;
      const duskDist = angDist(lon, duskCenter);
      const injection = Math.exp(-(duskDist*duskDist)/(2*70*70));

      let r = c.impactScore * timeWeight * compression;

      if(sw.bz < -5 || sw.kp >= 5){
        r += c.impactScore * 0.35 * timeWeight * injection;
      }

      risk = Math.max(risk, r);
    }

    const col = riskColor(risk);
    ctx.fillStyle = col;
    ctx.fillRect(i*w/360, h*.22, w/360+1, h*.28);
  }

  drawGeoAxis(ctx,w,h);

  ctx.fillStyle="#fff";
  ctx.font="13px system-ui";
  ctx.fillText("Time: " + time.toISOString().slice(0,16).replace("T"," ") + " UTC",12,22);
  ctx.fillText("Active CME influence: " + active.length,12,h*.62);
  ctx.fillText("Subsolar GEO longitude: " + center.toFixed(1) + "°",12,h*.68);
  ctx.fillText(`Solar wind: V=${sw.speed} km/s  Bz=${sw.bz} nT  Pdyn=${sw.dynamicPressure?.toFixed?.(2) || 0} nPa`,12,h*.74);

  document.getElementById("geoSummary").innerHTML =
    `表示時刻: <b>${time.toISOString().slice(0,16).replace("T"," ")} UTC</b><br>` +
    `影響中CME: <b>${active.length}</b><br>` +
    `昼側圧縮中心: <b>${center.toFixed(1)}°</b><br>` +
    `Bz南向き/Kp高の場合、夕方側注入リスクを追加`;
}

function drawGeoAxis(ctx,w,h){
  [-180,-120,-60,0,60,120,180].forEach(lon=>{
    const x=(lon+180)/360*w;
    ctx.strokeStyle="#fff5";
    ctx.beginPath();
    ctx.moveTo(x,h*.18);
    ctx.lineTo(x,h*.55);
    ctx.stroke();
    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";
    ctx.fillText(lon+"°",x+2,h*.18);
  });
}

function angDist(a,b){
  return Math.abs(((a-b+180)%360+360)%360-180);
}

function riskColor(s){
  if(s>=75)return"#ff1744";
  if(s>=55)return"#ff9100";
  if(s>=30)return"#ffee58";
  return"#8bc34a";
}

function renderTable(cmes){
  document.getElementById("table").innerHTML = `
  <table>
  <tr>
    <th>CME</th><th>t0</th><th>PA</th><th>幅</th><th>速度</th>
    <th>Halo</th><th>Impact</th><th>到達予想</th><th>継続</th>
  </tr>
  ${cmes.map(c=>`
    <tr>
      <td>${c.id}</td>
      <td>${c.t0}</td>
      <td>${c.pa}</td>
      <td>${c.da}</td>
      <td>${c.v}</td>
      <td>${c.halo || "-"}</td>
      <td style="color:${riskColor(c.impactScore)};font-weight:700">${c.impactScore}</td>
      <td>${c.arrival.utc.slice(0,16).replace("T"," ")}</td>
      <td>${c.durationHours}h</td>
    </tr>
  `).join("")}
  </table>`;
}

function playTimeline(){
  stopTimeline();
  GLOBAL.timer = setInterval(()=>{
    const s = document.getElementById("timeSlider");
    let v = +s.value + 1;
    if(v > 168) v = 0;
    s.value = v;
    updateTimeView();
  }, 300);
}

function stopTimeline(){
  if(GLOBAL.timer) clearInterval(GLOBAL.timer);
  GLOBAL.timer = null;
}

loadAll();
</script>

</body>
</html>
