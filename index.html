<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CME Satellite Hazard Robust</title>
<style>
body{margin:0;background:#070b12;color:#eee;font-family:system-ui,sans-serif}
header{background:#101826;border-bottom:1px solid #333;padding:16px}
button,input{margin:4px}
button{padding:10px 14px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:#141b27;border:1px solid #333;border-radius:14px;padding:14px}
.box{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:12px;overflow:hidden}
.widebox{position:relative;width:100%;height:320px;background:#000;border-radius:12px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
input[type=range]{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #333;padding:6px;text-align:left}
pre{background:#050608;border-radius:10px;padding:10px;white-space:pre-wrap;max-height:320px;overflow:auto}
.small{font-size:13px;color:#bbb;line-height:1.5}
.phase{margin-top:8px;padding:10px;border-radius:10px;background:#0d1320}
.bar{height:16px;border-radius:999px;background:#222;overflow:hidden;margin-top:6px}
.fill{height:100%}
</style>
</head>

<body>
<header>
<h2>CME → Satellite Hazard Assessment Robust</h2>
<div>
NASA API Key:
<input id="apiKey" value="DEMO_KEY" style="width:220px">
<button onclick="loadAll()">取得・更新</button>
<button onclick="playTimeline()">▶ 再生</button>
<button onclick="stopTimeline()">停止</button>
</div>
</header>

<main>

<div class="grid">
<section class="card">
<h3>① CME Source on Solar Disk</h3>
<div class="box"><canvas id="sunCanvas"></canvas></div>
<div id="sunSummary" class="small">未取得</div>
</section>

<section class="card">
<h3>② Satellite Hazard Assessment</h3>
<div id="hazardPanel" class="small">未取得</div>
</section>
</div>

<section class="card" style="margin-top:16px">
<h3>③ CME Propagation / Earth Arrival</h3>
<input id="timeSlider" type="range" min="0" max="168" value="0" step="1" oninput="updateTimeline()">
<div id="timeLabel" class="small"></div>
<div class="widebox"><canvas id="flowCanvas"></canvas></div>
</section>

<section class="card" style="margin-top:16px">
<h3>NOAA / DONKI Status</h3>
<div id="statusBox" class="small"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>CME Event Table</h3>
<div id="table"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>Raw / Debug</h3>
<pre id="raw"></pre>
</section>

</main>

<script>
const DONKI_CME_ANALYSIS = "https://api.nasa.gov/DONKI/CMEAnalysis";
const DONKI_CME = "https://api.nasa.gov/DONKI/CME";

const NOAA = {
  windNew:"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json",
  magNew:"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json",
  windOld:"https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json",
  magOld:"https://services.swpc.noaa.gov/products/solar-wind/mag-1-day.json",
  kp1:"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json",
  kp2:"https://services.swpc.noaa.gov/products/noaa-estimated-planetary-k-index-1-minute.json",
  proton:"https://services.swpc.noaa.gov/json/goes/primary/integral-protons-6-hour.json"
};

const AU_KM = 149597870;
const SOLAR_ROTATION = 13.2 / 24;

let GLOBAL = {
  cmes: [],
  sw: defaultSW(),
  proton: {p10:0,time:""},
  startTime:new Date(),
  timer:null,
  status:{}
};

function raw(x){document.getElementById("raw").textContent=x;}

async function loadAll(){
  raw("Loading...");
  const apiKey = document.getElementById("apiKey").value.trim() || "DEMO_KEY";

  const now = new Date();
  const start = new Date(now.getTime()-7*86400000).toISOString().slice(0,10);
  const end = now.toISOString().slice(0,10);

  const urls = {
    donkiAnalysis:`${DONKI_CME_ANALYSIS}?startDate=${start}&endDate=${end}&mostAccurateOnly=true&speed=300&api_key=${apiKey}`,
    donkiCME:`${DONKI_CME}?startDate=${start}&endDate=${end}&api_key=${apiKey}`
  };

  const results = await Promise.allSettled([
    fetchJson(urls.donkiAnalysis),
    fetchJson(urls.donkiCME),
    fetchJsonAny([NOAA.windNew, NOAA.windOld]),
    fetchJsonAny([NOAA.magNew, NOAA.magOld]),
    fetchJsonAny([NOAA.kp1, NOAA.kp2]),
    fetchJson(NOAA.proton)
  ]);

  const [donkiAnalysisR, donkiCMER, windR, magR, kpR, protonR] = results;

  const donkiAnalysis = valueOrEmpty(donkiAnalysisR);
  const donkiCME = valueOrEmpty(donkiCMER);
  const wind = valueOrEmpty(windR);
  const mag = valueOrEmpty(magR);
  const kp = valueOrEmpty(kpR);
  const protonRaw = valueOrEmpty(protonR);

  const sw = parseSolarWind(wind, mag, kp);
  const proton = parseProtons(protonRaw);

  let cmes = [];
  if(Array.isArray(donkiAnalysis) && donkiAnalysis.length){
    cmes = donkiAnalysis.map(c=>parseCMEAnalysis(c, sw)).filter(Boolean);
  }

  if(!cmes.length && Array.isArray(donkiCME) && donkiCME.length){
    cmes = parseFromDONKICME(donkiCME, sw);
  }

  cmes.sort((a,b)=>b.arrivalScore-a.arrivalScore);

  GLOBAL.cmes = cmes;
  GLOBAL.sw = sw;
  GLOBAL.proton = proton;
  GLOBAL.startTime = new Date();
  GLOBAL.status = {
    DONKI_CMEAnalysis: statusText(donkiAnalysisR, donkiAnalysis),
    DONKI_CME: statusText(donkiCMER, donkiCME),
    NOAA_wind: statusText(windR, wind),
    NOAA_mag: statusText(magR, mag),
    NOAA_kp: statusText(kpR, kp),
    NOAA_proton: statusText(protonR, protonRaw)
  };

  renderStatus();
  renderTable(cmes);
  updateTimeline();

  raw(JSON.stringify({
    status:GLOBAL.status,
    cmeCount:cmes.length,
    solarWind:sw,
    proton,
    topCmes:cmes.slice(0,20)
  },null,2));
}

async function fetchJson(url){
  const sep = url.includes("?") ? "&" : "?";
  const r = await fetch(url + sep + "t=" + Date.now());
  if(!r.ok) throw new Error("HTTP " + r.status + " " + url);
  return await r.json();
}

async function fetchJsonAny(urls){
  let lastErr = "";
  for(const url of urls){
    try{return await fetchJson(url);}
    catch(e){lastErr = e.message;}
  }
  throw new Error(lastErr);
}

function valueOrEmpty(result){
  return result.status === "fulfilled" ? result.value : [];
}

function statusText(result, data){
  if(result.status !== "fulfilled") return "FAILED: " + result.reason.message;
  if(Array.isArray(data)) return "OK: " + data.length + " records";
  return "OK";
}

function defaultSW(){
  return {time:"fallback",speed:400,density:0,by:0,bz:0,bt:0,kp:0,dynamicPressure:0,clockAngle:0};
}

function parseSolarWind(wind,mag,kp){
  const w = latest(wind);
  const b = latest(mag);
  const k = latest(kp);

  const speed = pick(w,["speed","proton_speed","bulk_speed",2]) || 400;
  const density = pick(w,["density","proton_density",1]);
  const by = pick(b,["by_gsm","by",2]);
  const bz = pick(b,["bz_gsm","bz",3]);
  const bt = pick(b,["bt","total_field",6]);
  const kpVal = pick(k,["kp_index","kp","estimated_kp","Kp",1]);

  const pdyn = density && speed ? 1.6726e-6 * density * speed * speed : 0;
  const clock = Math.max(0,Math.min(180,Math.atan2(Math.abs(by),bz)*180/Math.PI));

  return {
    time:getTime(w)||getTime(b)||getTime(k)||"",
    speed,density,by,bz,bt,kp:kpVal,
    dynamicPressure:pdyn,
    clockAngle:clock
  };
}

function parseProtons(arr){
  const p10 = latestEnergy(arr,">=10 MeV");
  return {p10:p10?.flux || 0,time:p10?.time_tag || ""};
}

function latestEnergy(arr,e){
  if(!Array.isArray(arr)) return null;
  for(let i=arr.length-1;i>=0;i--){
    const x = arr[i];
    if(String(x?.energy || "").includes(e)) return x;
  }
  return null;
}

function latest(arr){
  if(!Array.isArray(arr)) return {};
  for(let i=arr.length-1;i>=0;i--){
    const r=arr[i];
    if(Array.isArray(r)){
      if(String(r[0]).toLowerCase().includes("time")) continue;
      return r;
    }
    if(r && typeof r==="object") return r;
  }
  return {};
}

function pick(obj,names){
  for(const n of names){
    if(typeof n==="number" && Array.isArray(obj)){
      const v=Number(obj[n]); if(Number.isFinite(v)) return v;
    }
    if(typeof n==="string" && obj && obj[n]!==undefined){
      const v=Number(obj[n]); if(Number.isFinite(v)) return v;
    }
  }
  return 0;
}

function getTime(obj){
  if(Array.isArray(obj)) return obj[0] || "";
  if(!obj) return "";
  return obj.time_tag || obj.time || obj.observation_time || "";
}

function parseCMEAnalysis(c,sw){
  const lon=Number(c.longitude), lat=Number(c.latitude), speed=Number(c.speed), half=Number(c.halfAngle||20);
  if(!Number.isFinite(lon)||!Number.isFinite(lat)||!Number.isFinite(speed)) return null;

  const t0 = c.time21_5 ? new Date(c.time21_5) : new Date(c.activityStartTime || Date.now());
  const arrival = computeArrival(c, sw);
  const arrivalScore = scoreCME(lon,lat,speed,half);

  return {
    id:c.activityID || "CME",
    lon,lat,speed,halfAngle:half,t0,
    arrival,arrivalScore,
    activeStart:new Date(arrival.date.getTime()-6*3600*1000),
    activeEnd:new Date(arrival.date.getTime()+36*3600*1000),
    sourceType:"CMEAnalysis"
  };
}

function parseFromDONKICME(list,sw){
  const out=[];
  for(const c of list){
    const analyses = c.cmeAnalyses || [];
    for(const a of analyses){
      const merged = {...a, activityID:c.activityID, activityStartTime:c.startTime};
      const item = parseCMEAnalysis(merged, sw);
      if(item) out.push(item);
    }
  }
  return out;
}

function scoreCME(lon,lat,speed,half){
  const d=Math.sqrt(lon*lon+lat*lat);
  const earth = d<=half ? 45 : d<=half+20 ? 30 : d<=half+40 ? 18 : 5;
  const sp = speed>=2000?30:speed>=1500?24:speed>=1000?16:speed>=700?10:4;
  const wd = Math.min(25,half*0.45);
  return Math.min(100,Math.round(earth+sp+wd));
}

function computeArrival(c,sw){
  const enlil = bestEnlil(c);
  if(enlil?.estimatedShockArrivalTime){
    const d=new Date(enlil.estimatedShockArrivalTime);
    return {source:"ENLIL",date:d,utc:d.toISOString()};
  }

  const t0 = c.time21_5 ? new Date(c.time21_5) : new Date(c.activityStartTime || Date.now());
  const bg = sw.speed || 400;
  let v = Number(c.speed);
  if(v>bg) v = bg+(v-bg)*0.62;
  if(v<320) v=320;
  const hours = AU_KM/v/3600;
  const d = new Date(t0.getTime()+hours*3600*1000);
  return {source:"DBM-lite",date:d,utc:d.toISOString()};
}

function bestEnlil(c){
  if(!Array.isArray(c.enlilList)) return null;
  return c.enlilList.filter(x=>x?.estimatedShockArrivalTime)[0] || null;
}

function updateTimeline(){
  const h=Number(document.getElementById("timeSlider").value);
  const t=new Date(GLOBAL.startTime.getTime()+h*3600*1000);
  document.getElementById("timeLabel").innerHTML =
    `<b>${t.toISOString().slice(0,16).replace("T"," ")} UTC</b> / 現在+${h}h`;
  drawSun(GLOBAL.cmes,t);
  drawFlow(GLOBAL.cmes,t);
  renderHazard(t);
}

function drawSun(cmes,time){
  const {ctx,w,h,cx,cy,r}=setup("sunCanvas");
  ctx.clearRect(0,0,w,h);
  const g=ctx.createRadialGradient(cx-r*.25,cy-r*.25,r*.1,cx,cy,r);
  g.addColorStop(0,"#fff59d");g.addColorStop(.55,"#ffb300");g.addColorStop(1,"#e65100");
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle="#fff5";ctx.stroke();

  let visible=0;
  cmes.slice(0,40).forEach(c=>{
    const lon=normalizeLon(c.lon + SOLAR_ROTATION*((time-c.t0)/3600000));
    const p=ortho(c.lat,lon);
    if(!p.visible) return;
    visible++;
    const x=cx+p.x*r,y=cy+p.y*r,col=riskColor(c.arrivalScore);
    const size=Math.max(5,Math.min(30,c.halfAngle/3));
    ctx.beginPath();ctx.arc(x,y,size+5,0,Math.PI*2);ctx.fillStyle=col+"55";ctx.fill();
    ctx.beginPath();ctx.arc(x,y,size,0,Math.PI*2);ctx.fillStyle=col;ctx.fill();
    ctx.fillStyle="#fff";ctx.font="11px system-ui";ctx.fillText(shortId(c.id),x+size+6,y);
  });

  document.getElementById("sunSummary").innerHTML =
    `Visible CME sources: <b>${visible}</b><br>CME records: <b>${cmes.length}</b><br>Color = Earth arrival score`;
}

function drawFlow(cmes,time){
  const {ctx,w,h}=setupWide("flowCanvas");
  ctx.clearRect(0,0,w,h);
  const sx=70,ex=w-80,y=h/2,len=ex-sx;

  ctx.strokeStyle="#ffffff22";ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(sx,y);ctx.lineTo(ex,y);ctx.stroke();
  ctx.beginPath();ctx.arc(sx,y,28,0,Math.PI*2);ctx.fillStyle="#ffb300";ctx.fill();
  ctx.beginPath();ctx.arc(ex,y,14,0,Math.PI*2);ctx.fillStyle="#4fc3f7";ctx.fill();

  ctx.fillStyle="#fff";ctx.font="12px system-ui";
  ctx.fillText("Sun",sx-10,y+45);ctx.fillText("Earth",ex-20,y+35);
  ctx.fillText("CME propagation to Earth",12,24);

  cmes.slice(0,15).forEach((c,idx)=>{
    const total=c.arrival.date-c.t0, elapsed=time-c.t0;
    if(total<=0) return;
    const frac=elapsed/total;
    if(frac<-0.05||frac>1.2) return;
    const x=sx+Math.max(0,Math.min(1.1,frac))*len;
    const lane=y-80+(idx%7)*26, col=riskColor(c.arrivalScore);
    ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,Math.min(18,c.halfAngle/4));ctx.globalAlpha=.75;
    ctx.beginPath();ctx.arc(x,lane,20+c.halfAngle*.7,-.9,.9);ctx.stroke();ctx.globalAlpha=1;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,lane,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="#fff";ctx.font="11px system-ui";ctx.fillText(`${shortId(c.id)} ${Math.round(frac*100)}%`,x+8,lane-8);
  });
}

function renderHazard(time){
  const active = GLOBAL.cmes.filter(c=>time>=c.activeStart && time<=c.activeEnd).sort((a,b)=>b.arrivalScore-a.arrivalScore);
  const top=active[0];

  if(!top){
    document.getElementById("hazardPanel").innerHTML = `
      <div class="phase"><b style="color:#8bc34a">🟢 Quiet</b><br>No active CME hazard window.</div>`;
    return;
  }

  const dt=(time-top.arrival.date)/3600000;
  const phase = dt<0 ? "🟡 CME Shock Approaching" :
                dt<3 ? "🟠 Magnetosphere Compression" :
                dt<12 ? "🟠 Surface Charging Risk" : "🔴 Deep Charging Risk";

  const seu = GLOBAL.proton.p10>=10 ? 80 : top.arrivalScore*0.5;
  const surface = top.arrivalScore + GLOBAL.sw.dynamicPressure*2;
  const deep = dt>12 ? top.arrivalScore+20 : top.arrivalScore*0.5;
  const gnss = GLOBAL.sw.kp*12;
  const drag = GLOBAL.sw.kp*8;

  document.getElementById("hazardPanel").innerHTML = `
    <div class="phase"><b>${phase}</b><br>
    Top event: ${shortId(top.id)}<br>
    Arrival: ${top.arrival.utc.slice(0,16).replace("T"," ")} UTC / ${top.arrival.source}</div>
    ${hazardCard("SEU Risk",seu,"High-energy particles may induce memory upset.")}
    ${hazardCard("Surface Charging",surface,"Enhanced plasma may increase discharge risk.")}
    ${hazardCard("Deep Charging",deep,"Relativistic electrons may affect dielectric materials.")}
    ${hazardCard("GNSS Error",gnss,"Ionospheric disturbance may degrade positioning.")}
    ${hazardCard("LEO Drag",drag,"Thermospheric expansion may increase drag.")}
  `;
}

function hazardCard(title,val,desc){
  val=Math.max(0,Math.min(100,Math.round(val)));
  const col=riskColor(val);
  return `<div class="phase"><b>${title}: <span style="color:${col}">${label(val)}</span></b>
  <div class="bar"><div class="fill" style="width:${val}%;background:${col}"></div></div>
  <div class="small">${desc}</div></div>`;
}

function renderStatus(){
  document.getElementById("statusBox").innerHTML =
    Object.entries(GLOBAL.status).map(([k,v])=>`<b>${k}</b>: ${v}`).join("<br>") +
    `<hr>Solar wind: V=${GLOBAL.sw.speed} km/s, Bz=${GLOBAL.sw.bz}, Kp=${GLOBAL.sw.kp}<br>`+
    `GOES proton ≥10MeV: ${GLOBAL.proton.p10} pfu`;
}

function renderTable(cmes){
  if(!cmes.length){
    document.getElementById("table").innerHTML = "CMEデータなし。NASA APIキー制限またはDONKIに該当CMEがありません。";
    return;
  }
  document.getElementById("table").innerHTML = `<table>
  <tr><th>ID</th><th>Lon</th><th>Lat</th><th>Speed</th><th>Half</th><th>Risk</th><th>Arrival</th><th>Source</th></tr>
  ${cmes.map(c=>`<tr><td>${c.id}</td><td>${c.lon}</td><td>${c.lat}</td><td>${c.speed}</td><td>${c.halfAngle}</td>
  <td style="color:${riskColor(c.arrivalScore)};font-weight:700">${c.arrivalScore}</td>
  <td>${c.arrival.utc.slice(0,16).replace("T"," ")}</td><td>${c.arrival.source}</td></tr>`).join("")}
  </table>`;
}

function setup(id){
  const c=document.getElementById(id),dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=rect.height*dpr;
  const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:rect.width,h:rect.height,cx:rect.width/2,cy:rect.height/2,r:Math.min(rect.width,rect.height)*.38};
}

function setupWide(id){
  const c=document.getElementById(id),dpr=devicePixelRatio||1,rect=c.getBoundingClientRect();
  c.width=rect.width*dpr;c.height=rect.height*dpr;
  const ctx=c.getContext("2d");ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:rect.width,h:rect.height};
}

function ortho(latDeg,lonDeg){
  const lat=latDeg*Math.PI/180,lon=lonDeg*Math.PI/180;
  return {x:Math.cos(lat)*Math.sin(lon),y:-Math.sin(lat),z:Math.cos(lat)*Math.cos(lon),visible:Math.cos(lat)*Math.cos(lon)>0};
}

function normalizeLon(lon){while(lon>180)lon-=360;while(lon<-180)lon+=360;return lon;}
function riskColor(v){if(v>=85)return"#d500f9";if(v>=70)return"#ff1744";if(v>=45)return"#ff9800";if(v>=20)return"#ffee58";return"#8bc34a";}
function label(v){if(v>=85)return"EXTREME";if(v>=70)return"HIGH";if(v>=45)return"MODERATE";if(v>=20)return"LOW";return"MINIMAL";}
function shortId(id){const s=String(id||"CME");return s.includes("CME") ? "CME"+s.split("CME").pop().replace(/[^0-9]/g,"").slice(-4) : s.slice(-6);}

function playTimeline(){
  stopTimeline();
  GLOBAL.timer=setInterval(()=>{
    const s=document.getElementById("timeSlider");
    let v=Number(s.value)+1;if(v>168)v=0;s.value=v;updateTimeline();
  },300);
}
function stopTimeline(){if(GLOBAL.timer)clearInterval(GLOBAL.timer);GLOBAL.timer=null;}

loadAll();
</script>
</body>
</html>
