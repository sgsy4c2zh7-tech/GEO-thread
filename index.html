<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEP Direct Impact Forecast</title>
<style>
body{margin:0;background:#070b12;color:#eee;font-family:system-ui,sans-serif}
header{background:#101826;border-bottom:1px solid #333;padding:16px}
button{padding:10px 14px;margin:4px;border:0;border-radius:8px;cursor:pointer;font-weight:700}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:#141b27;border:1px solid #333;border-radius:14px;padding:14px}
.box{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:12px;overflow:hidden}
.widebox{position:relative;width:100%;height:290px;background:#000;border-radius:12px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
input[type=range]{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #333;padding:6px;text-align:left}
pre{background:#050608;border-radius:10px;padding:10px;white-space:pre-wrap;max-height:320px;overflow:auto}
.small{font-size:13px;color:#bbb;line-height:1.5}
.ok{color:#8bc34a}.warn{color:#ffd54f}.mid{color:#ff9800}.bad{color:#ff5252}
</style>
</head>

<body>
<header>
<h2>SEP Direct Impact Forecast / DONKI + GOES Proton + Parker Spiral</h2>
<button onclick="loadAll()">DONKI + NOAA取得</button>
<button onclick="playTimeline()">▶ 再生</button>
<button onclick="stopTimeline()">停止</button>
</header>

<main>

<div class="grid">
<section class="card">
<h3>① SEP発生源候補 太陽面</h3>
<div class="box"><canvas id="sunCanvas"></canvas></div>
<div id="sunSummary" class="small"></div>
</section>

<section class="card">
<h3>② SEP直接影響タイムライン</h3>
<div class="box"><canvas id="sepCanvas"></canvas></div>
<div id="sepSummary" class="small"></div>
</section>
</div>

<section class="card" style="margin-top:16px">
<h3>③ 太陽→地球 SEP伝播</h3>
<input id="timeSlider" type="range" min="0" max="168" value="0" step="1" oninput="updateTimeline()">
<div id="timeLabel" class="small"></div>
<div class="widebox"><canvas id="flowCanvas"></canvas></div>
</section>

<section class="card" style="margin-top:16px">
<h3>GOES Proton / NOAA Solar Wind</h3>
<div id="protonBox" class="small"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>SEP候補イベント一覧</h3>
<div id="table"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>Status / Raw</h3>
<pre id="raw"></pre>
</section>

</main>

<script>
const NASA_KEY = "DEMO_KEY";

const DONKI = {
  cmeAnalysis: "https://api.nasa.gov/DONKI/CMEAnalysis",
  sep: "https://api.nasa.gov/DONKI/SEP"
};

const NOAA = {
  protons: "https://services.swpc.noaa.gov/json/goes/primary/integral-protons-6-hour.json",
  wind: "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
};

const SOLAR_ROTATION_DEG_PER_HOUR = 13.2 / 24;

let GLOBAL = {
  events: [],
  protons: {},
  wind: {},
  startTime: new Date(),
  timer: null
};

function raw(x){ document.getElementById("raw").textContent = x; }

async function loadAll(){
  raw("取得中...");

  try{
    const now = new Date();
    const start = new Date(now.getTime() - 7*86400000).toISOString().slice(0,10);
    const end = now.toISOString().slice(0,10);

    const cmeUrl =
      `${DONKI.cmeAnalysis}?startDate=${start}&endDate=${end}&mostAccurateOnly=true&speed=300&api_key=${NASA_KEY}`;

    const sepUrl =
      `${DONKI.sep}?startDate=${start}&endDate=${end}&api_key=${NASA_KEY}`;

    const [cmeRaw, sepRaw, protonRaw, windRaw] = await Promise.all([
      fetchJSON(cmeUrl),
      fetchJSON(sepUrl).catch(()=>[]),
      fetchJSON(NOAA.protons),
      fetchJSON(NOAA.wind).catch(()=>[])
    ]);

    const wind = parseWind(windRaw);
    const protons = parseProtons(protonRaw);

    const events = cmeRaw
      .map(c => parseCMEtoSEP(c, wind, protons))
      .filter(Boolean)
      .sort((a,b)=>b.sepScore-a.sepScore);

    GLOBAL.events = events;
    GLOBAL.protons = protons;
    GLOBAL.wind = wind;
    GLOBAL.startTime = new Date();

    renderProtonBox(protons, wind, sepRaw);
    renderTable(events);
    updateTimeline();

    raw(JSON.stringify({
      note: "SEP direct impact model: DONKI CMEAnalysis + GOES proton + Parker Spiral connection.",
      cmeCount: cmeRaw.length,
      donkiSepCount: sepRaw.length,
      parkerConnectionLongitude: parkerConnectionLongitude(wind.speed),
      protons,
      wind,
      topEvents: events.slice(0,20),
      donkiSEP: sepRaw
    }, null, 2));

  }catch(e){
    raw("ERROR: " + e.message);
  }
}

async function fetchJSON(url){
  const sep = url.includes("?") ? "&" : "?";
  const r = await fetch(url + sep + "t=" + Date.now());
  if(!r.ok) throw new Error("HTTP " + r.status + " : " + url);
  return await r.json();
}

function parseWind(arr){
  const row = latest(arr);
  const speed = pick(row,["speed","proton_speed","bulk_speed",2]) || 400;
  const density = pick(row,["density","proton_density",1]);

  return {
    time:getTime(row),
    speed,
    density,
    parkerLon: parkerConnectionLongitude(speed)
  };
}

function parseProtons(arr){
  const latest10 = findLatestEnergy(arr, ">=10 MeV");
  const latest50 = findLatestEnergy(arr, ">=50 MeV");
  const latest100 = findLatestEnergy(arr, ">=100 MeV");

  return {
    p10: latest10?.flux ?? 0,
    p50: latest50?.flux ?? 0,
    p100: latest100?.flux ?? 0,
    time: latest10?.time_tag || latest50?.time_tag || latest100?.time_tag || "",
    scale: radiationScale(latest10?.flux ?? 0)
  };
}

function findLatestEnergy(arr, energy){
  if(!Array.isArray(arr)) return null;

  for(let i=arr.length-1;i>=0;i--){
    const x = arr[i];
    if(!x) continue;
    if(String(x.energy || "").includes(energy)){
      return x;
    }
  }
  return null;
}

function radiationScale(p10){
  if(p10 >= 100000) return "S5";
  if(p10 >= 10000) return "S4";
  if(p10 >= 1000) return "S3";
  if(p10 >= 100) return "S2";
  if(p10 >= 10) return "S1";
  return "S0";
}

function latest(arr){
  if(!Array.isArray(arr)) return {};
  for(let i=arr.length-1;i>=0;i--){
    const r = arr[i];
    if(Array.isArray(r)){
      if(String(r[0]).toLowerCase().includes("time")) continue;
      return r;
    }
    if(r && typeof r === "object") return r;
  }
  return {};
}

function pick(obj,names){
  for(const n of names){
    if(typeof n === "number" && Array.isArray(obj)){
      const v = Number(obj[n]);
      if(Number.isFinite(v)) return v;
    }
    if(typeof n === "string" && obj[n] !== undefined){
      const v = Number(obj[n]);
      if(Number.isFinite(v)) return v;
    }
  }
  return 0;
}

function getTime(obj){
  if(Array.isArray(obj)) return obj[0] || "";
  if(!obj) return "";
  return obj.time_tag || obj.time || obj.observation_time || "";
}

// Parker Spiral接続経度の簡易推定。
// 太陽風が遅いほど西側接続点が大きくなる。
// 400 km/sで約W55を基準。
function parkerConnectionLongitude(speed){
  const v = speed || 400;
  const lon = 55 * (400 / v);
  return Math.max(25, Math.min(85, lon));
}

function parseCMEtoSEP(c, wind, protons){
  if(!c.speed) return null;

  const lon = Number(c.longitude);
  const lat = Number(c.latitude);
  const speed = Number(c.speed);
  const half = Number(c.halfAngle || 20);

  if(!Number.isFinite(lon) || !Number.isFinite(lat) || !Number.isFinite(speed)){
    return null;
  }

  const t0 = c.time21_5
    ? new Date(c.time21_5)
    : new Date(c.activityStartTime || Date.now());

  const connection = magneticConnectionScore(lon, half, wind.parkerLon);
  const shock = shockScore(speed, half);
  const width = widthScore(half);
  const protonNow = protonBoost(protons.p10);

  const sepScore = Math.min(100, Math.round(connection + shock + width + protonNow));

  const onset = estimateSEPOnset(t0, speed, connection, sepScore);
  const peak = new Date(onset.getTime() + peakDelayHours(sepScore)*3600*1000);
  const duration = durationHours(sepScore, half);

  return {
    id: c.activityID || ("CME-" + Math.random().toString(36).slice(2,7)),
    catalog: c.catalog || "",
    lon, lat, speed, halfAngle: half,
    t0,
    parkerLon: wind.parkerLon,
    connectionScore: Math.round(connection),
    shockScore: Math.round(shock),
    sepScore,
    predictedScale: predictedScale(sepScore),
    onset,
    peak,
    end: new Date(onset.getTime() + duration*3600*1000),
    durationHours: duration
  };
}

function magneticConnectionScore(lon, half, parkerLon){
  // DONKI longitude: W側を正とみなす想定
  const d = Math.abs(lon - parkerLon);

  let score = 0;

  if(d <= 15) score = 40;
  else if(d <= 30) score = 32;
  else if(d <= 45) score = 22;
  else if(d <= 65) score = 12;
  else score = 3;

  // 幅広CMEなら接続しやすい
  if(half >= 60) score += 10;
  if(half >= 90) score += 15;

  // 西側W20-W80付近を少し加点
  if(lon >= 20 && lon <= 80) score += 10;

  return Math.min(55, score);
}

function shockScore(speed, half){
  let s =
    speed >= 2000 ? 35 :
    speed >= 1500 ? 28 :
    speed >= 1000 ? 20 :
    speed >= 700 ? 12 :
    speed >= 500 ? 6 : 2;

  if(half >= 60) s += 5;
  if(half >= 90) s += 8;

  return Math.min(40, s);
}

function widthScore(half){
  return Math.min(20, half * 0.25);
}

function protonBoost(p10){
  if(p10 >= 1000) return 30;
  if(p10 >= 100) return 22;
  if(p10 >= 10) return 15;
  if(p10 >= 1) return 6;
  return 0;
}

function predictedScale(score){
  if(score >= 90) return "S3+";
  if(score >= 75) return "S2";
  if(score >= 55) return "S1";
  if(score >= 35) return "Watch";
  return "Low";
}

function estimateSEPOnset(t0, speed, connection, score){
  // 高速・接続良好なら早い。遅い/接続悪いなら遅い。
  let hours =
    speed >= 1800 ? 0.7 :
    speed >= 1300 ? 1.2 :
    speed >= 900 ? 2.5 :
    speed >= 600 ? 5 : 8;

  if(connection >= 35) hours -= 0.5;
  if(score >= 75) hours -= 0.3;
  if(hours < 0.3) hours = 0.3;

  return new Date(t0.getTime() + hours*3600*1000);
}

function peakDelayHours(score){
  if(score >= 75) return 4;
  if(score >= 55) return 7;
  if(score >= 35) return 12;
  return 18;
}

function durationHours(score, half){
  let h =
    score >= 75 ? 48 :
    score >= 55 ? 36 :
    score >= 35 ? 24 : 12;

  if(half >= 80) h += 12;
  return h;
}

function updateTimeline(){
  const h = Number(document.getElementById("timeSlider").value);
  const t = new Date(GLOBAL.startTime.getTime() + h*3600*1000);

  document.getElementById("timeLabel").innerHTML =
    `<b>${t.toISOString().slice(0,16).replace("T"," ")} UTC</b> / 現在+${h}h`;

  drawSun(GLOBAL.events, t);
  drawSEP(GLOBAL.events, GLOBAL.protons, t);
  drawFlow(GLOBAL.events, t);
}

function drawSun(events, displayTime){
  const {ctx,w,h,cx,cy,r} = setup("sunCanvas");
  ctx.clearRect(0,0,w,h);

  const g = ctx.createRadialGradient(cx-r*0.25,cy-r*0.25,r*0.1,cx,cy,r);
  g.addColorStop(0,"#fff59d");
  g.addColorStop(0.55,"#ffb300");
  g.addColorStop(1,"#e65100");

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle="#fff5";
  ctx.lineWidth=2;
  ctx.stroke();

  drawSolarGrid(ctx,cx,cy,r);

  // Parker Spiral接続帯
  const parker = GLOBAL.wind.parkerLon || 55;
  drawConnectionBand(ctx,cx,cy,r,parker);

  ctx.fillStyle="#fff";
  ctx.font="13px system-ui";
  ctx.fillText("SEP source candidates / Parker spiral connection",12,24);
  ctx.fillText("N",cx-4,cy-r-10);
  ctx.fillText("S",cx-4,cy+r+20);
  ctx.fillText("E",cx-r-24,cy+4);
  ctx.fillText("W",cx+r+12,cy+4);

  let visible = 0, hidden = 0;

  events.slice(0,40).forEach(e=>{
    const rotLon = rotatedLongitude(e, displayTime);
    const p = projectSolarOrthographic(e.lat, rotLon);

    if(!p.visible){
      hidden++;
      return;
    }

    visible++;

    const x = cx + p.x*r;
    const y = cy + p.y*r;
    const col = sepColor(e.sepScore);
    const size = Math.max(5, Math.min(32, e.halfAngle/3));

    ctx.beginPath();
    ctx.arc(x,y,size+5,0,Math.PI*2);
    ctx.fillStyle=col+"55";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x,y,size,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.fill();

    ctx.strokeStyle="#000";
    ctx.lineWidth=1;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x,y,Math.min(r*0.35,size+e.halfAngle*0.8),0,Math.PI*2);
    ctx.strokeStyle=col+"99";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";
    ctx.fillText(shortId(e.id),x+size+6,y);
  });

  document.getElementById("sunSummary").innerHTML =
    `Parker接続経度: <b>W${parker.toFixed(0)}</b><br>`+
    `表示時刻の太陽面: <b>${visible}</b>件 / 裏面・limb外: <b>${hidden}</b>件<br>`+
    `色 = SEP score、点サイズ = halfAngle<br>`+
    `西側W20〜W80付近、特にParker接続帯に近いCMEを高リスク化`;
}

function drawConnectionBand(ctx,cx,cy,r,parkerLon){
  ctx.save();
  ctx.strokeStyle="rgba(80,200,255,0.9)";
  ctx.lineWidth=3;

  [-15,0,15].forEach(offset=>{
    const lon = parkerLon + offset;
    ctx.beginPath();
    for(let lat=-65; lat<=65; lat+=2){
      const p = projectSolarOrthographic(lat, lon);
      if(!p.visible) continue;
      const x = cx + p.x*r;
      const y = cy + p.y*r;
      if(lat === -65) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  });

  ctx.fillStyle="#80d8ff";
  ctx.font="12px system-ui";
  ctx.fillText("Parker connection",cx+r*0.2,cy-r*0.65);
  ctx.restore();
}

function drawSEP(events, protons, time){
  const {ctx,w,h} = setup("sepCanvas");
  ctx.clearRect(0,0,w,h);

  const active = events.filter(e => time>=e.onset && time<=e.end);

  for(let i=0;i<360;i++){
    const lon = -180+i;
    let risk = 0;

    for(const e of active){
      const dt = Math.abs(time - e.peak)/3600000;
      const timeWeight = Math.exp(-(dt*dt)/(2*12*12));

      // SEPはGEO経度差より全体影響が強いが、
      // 可視化上は接続経度側をやや高くする。
      const geoWeight = 0.75 + 0.25*Math.exp(-(angDist(lon,e.parkerLon)**2)/(2*70*70));

      const r = e.sepScore * timeWeight * geoWeight;
      risk = Math.max(risk, r);
    }

    ctx.fillStyle = sepColor(risk);
    ctx.fillRect(i*w/360,h*0.25,w/360+1,h*0.3);
  }

  drawGeoAxis(ctx,w,h);

  ctx.fillStyle="#fff";
  ctx.font="13px system-ui";
  ctx.fillText(`Time: ${time.toISOString().slice(0,16).replace("T"," ")} UTC`,12,22);
  ctx.fillText(`GOES >=10MeV: ${protons.p10} pfu / ${protons.scale}`,12,h*0.72);

  document.getElementById("sepSummary").innerHTML =
    `影響中SEP候補: <b>${active.length}</b><br>`+
    `現在GOES ≥10MeV: <b>${protons.p10}</b> pfu / ${protons.scale}<br>`+
    `SEPはGEO全体に影響しやすいため、経度差は補助表示です。`;
}

function drawFlow(events,time){
  const {ctx,w,h} = setupWide("flowCanvas");
  ctx.clearRect(0,0,w,h);

  const sx=70, ex=w-80, y=h/2, len=ex-sx;

  ctx.strokeStyle="#ffffff22";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(sx,y);
  ctx.lineTo(ex,y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(sx,y,28,0,Math.PI*2);
  ctx.fillStyle="#ffb300";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ex,y,14,0,Math.PI*2);
  ctx.fillStyle="#4fc3f7";
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="12px system-ui";
  ctx.fillText("Sun",sx-12,y+48);
  ctx.fillText("Earth / GEO",ex-34,y+38);
  ctx.fillText("SEP particle front / fast protons arrive much earlier than CME plasma",12,24);

  events.slice(0,12).forEach(e=>{
    const total = e.onset - e.t0;
    const elapsed = time - e.t0;
    const frac = Math.max(0,Math.min(1.15,elapsed/total));

    if(frac<=0 || frac>1.1) return;

    const x = sx + frac*len;
    const col = sepColor(e.sepScore);

    ctx.strokeStyle=col;
    ctx.lineWidth=Math.max(2,Math.min(18,e.halfAngle/3));
    ctx.globalAlpha=0.78;

    ctx.beginPath();
    ctx.arc(x,y,25+e.halfAngle*0.8,-0.9,0.9);
    ctx.stroke();

    ctx.globalAlpha=1;

    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(x,y,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";
    ctx.fillText(`${shortId(e.id)} ${e.predictedScale}`,x+8,y-24);
  });
}

function renderProtonBox(protons, wind, sepRaw){
  const cls = protons.scale === "S0" ? "ok" :
              protons.scale === "S1" ? "warn" :
              protons.scale === "S2" ? "mid" : "bad";

  document.getElementById("protonBox").innerHTML =
    `GOES Proton time: <b>${protons.time || "不明"}</b><br>`+
    `≥10 MeV: <b class="${cls}">${protons.p10}</b> pfu / ${protons.scale}<br>`+
    `≥50 MeV: <b>${protons.p50}</b> pfu<br>`+
    `≥100 MeV: <b>${protons.p100}</b> pfu<br>`+
    `Solar wind speed: <b>${wind.speed}</b> km/s<br>`+
    `Parker connection longitude: <b>W${wind.parkerLon.toFixed(0)}</b><br>`+
    `DONKI SEP events in period: <b>${sepRaw.length}</b>`;
}

function renderTable(events){
  document.getElementById("table").innerHTML =
  `<table>
  <tr>
    <th>ID</th><th>Lon</th><th>Lat</th><th>Speed</th><th>Half</th>
    <th>Conn</th><th>SEP</th><th>Scale</th><th>Onset</th><th>Peak</th>
  </tr>
  ${
    events.map(e=>`
    <tr>
      <td>${e.id}</td>
      <td>${e.lon}</td>
      <td>${e.lat}</td>
      <td>${e.speed}</td>
      <td>${e.halfAngle}</td>
      <td>${e.connectionScore}</td>
      <td style="color:${sepColor(e.sepScore)};font-weight:700">${e.sepScore}</td>
      <td>${e.predictedScale}</td>
      <td>${e.onset.toISOString().slice(0,16).replace("T"," ")}</td>
      <td>${e.peak.toISOString().slice(0,16).replace("T"," ")}</td>
    </tr>
    `).join("")
  }
  </table>`;
}

function rotatedLongitude(e, displayTime){
  const hours = (displayTime - e.t0) / 3600000;
  return normalizeLon(e.lon + SOLAR_ROTATION_DEG_PER_HOUR * hours);
}

function projectSolarOrthographic(latDeg, lonDeg){
  const lat = latDeg * Math.PI/180;
  const lon = lonDeg * Math.PI/180;
  const x = Math.cos(lat) * Math.sin(lon);
  const y = -Math.sin(lat);
  const z = Math.cos(lat) * Math.cos(lon);
  return {x,y,z,visible:z > 0};
}

function drawSolarGrid(ctx,cx,cy,r){
  ctx.strokeStyle="rgba(255,255,255,0.16)";
  ctx.lineWidth=1;

  [-60,-30,0,30,60].forEach(lat=>{
    ctx.beginPath();
    for(let lon=-90; lon<=90; lon+=2){
      const p = projectSolarOrthographic(lat,lon);
      const x = cx + p.x*r;
      const y = cy + p.y*r;
      if(lon === -90) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  });

  [-60,-30,0,30,60].forEach(lon=>{
    ctx.beginPath();
    for(let lat=-89; lat<=89; lat+=2){
      const p = projectSolarOrthographic(lat,lon);
      const x = cx + p.x*r;
      const y = cy + p.y*r;
      if(lat === -89) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  });
}

function setup(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width*dpr;
  c.height = rect.height*dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:rect.width,h:rect.height,cx:rect.width/2,cy:rect.height/2,r:Math.min(rect.width,rect.height)*0.38};
}

function setupWide(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();
  c.width = rect.width*dpr;
  c.height = rect.height*dpr;
  const ctx = c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w:rect.width,h:rect.height};
}

function drawGeoAxis(ctx,w,h){
  [-180,-120,-60,0,60,120,180].forEach(lon=>{
    const x = (lon+180)/360*w;
    ctx.strokeStyle="#fff5";
    ctx.beginPath();
    ctx.moveTo(x,h*0.2);
    ctx.lineTo(x,h*0.58);
    ctx.stroke();
    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";
    ctx.fillText(lon+"°",x+2,h*0.2);
  });
}

function angDist(a,b){
  return Math.abs(((a-b+180)%360+360)%360-180);
}

function normalizeLon(lon){
  while(lon>180) lon-=360;
  while(lon<-180) lon+=360;
  return lon;
}

function sepColor(s){
  if(s>=90) return "#d500f9";
  if(s>=75) return "#ff1744";
  if(s>=55) return "#ff9100";
  if(s>=35) return "#ffee58";
  return "#8bc34a";
}

function shortId(id){
  const s = String(id || "CME");
  if(s.includes("CME")){
    return "CME" + s.split("CME").pop().replace(/[^0-9]/g,"").slice(-4);
  }
  return s.slice(-6);
}

function playTimeline(){
  stopTimeline();
  GLOBAL.timer = setInterval(()=>{
    const s = document.getElementById("timeSlider");
    let v = Number(s.value)+1;
    if(v>168) v=0;
    s.value=v;
    updateTimeline();
  },300);
}

function stopTimeline(){
  if(GLOBAL.timer) clearInterval(GLOBAL.timer);
  GLOBAL.timer=null;
}

loadAll();
</script>
