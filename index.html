<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CME Earth Arrival Forecast</title>
<style>
body{margin:0;background:#070b12;color:#eee;font-family:system-ui,sans-serif}
header{background:#101826;border-bottom:1px solid #333;padding:16px}
button{padding:10px 14px;margin:4px;border:0;border-radius:8px;font-weight:700;cursor:pointer}
main{padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:16px}
.card{background:#141b27;border:1px solid #333;border-radius:14px;padding:14px}
.box{position:relative;width:100%;aspect-ratio:1/1;background:#000;border-radius:12px;overflow:hidden}
.widebox{position:relative;width:100%;height:300px;background:#000;border-radius:12px;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%}
input[type=range]{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{border-bottom:1px solid #333;padding:6px;text-align:left}
pre{background:#050608;border-radius:10px;padding:10px;white-space:pre-wrap;max-height:320px;overflow:auto}
.small{font-size:13px;color:#bbb;line-height:1.5}
</style>
</head>

<body>
<header>
<h2>CME Earth Arrival Forecast / DONKI + ENLIL + DBM-lite</h2>
<button onclick="loadAll()">DONKI + NOAA取得</button>
<button onclick="playTimeline()">▶ 再生</button>
<button onclick="stopTimeline()">停止</button>
</header>

<main>

<div class="grid">
<section class="card">
<h3>① DONKI CME 太陽面</h3>
<div class="box"><canvas id="sunCanvas"></canvas></div>
<div id="sunSummary" class="small"></div>
</section>

<section class="card">
<h3>② 地球到達リスク</h3>
<div class="box"><canvas id="earthCanvas"></canvas></div>
<div id="earthSummary" class="small"></div>
</section>
</div>

<section class="card" style="margin-top:16px">
<h3>③ 太陽→地球 CME伝播</h3>
<input id="timeSlider" type="range" min="0" max="168" value="0" step="1" oninput="updateTimeline()">
<div id="timeLabel" class="small"></div>
<div class="widebox"><canvas id="flowCanvas"></canvas></div>
</section>

<section class="card" style="margin-top:16px">
<h3>NOAA 現況太陽風</h3>
<div id="windBox" class="small"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>CME到達予測一覧</h3>
<div id="table"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>Status / Raw</h3>
<pre id="raw"></pre>
</section>

</main>

<script>
const NASA_KEY = "DEMO_KEY";

const DONKI_CME =
  "https://api.nasa.gov/DONKI/CMEAnalysis";

const NOAA = {
  wind:"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json",
  mag:"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json",
  kp:"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
};

const SOLAR_ROTATION_DEG_PER_HOUR = 13.2 / 24;
const AU_KM = 149597870;

let GLOBAL = {
  cmes: [],
  sw: {},
  startTime: new Date(),
  timer: null
};

function raw(x){
  document.getElementById("raw").textContent = x;
}

async function loadAll(){
  raw("取得中...");

  try{
    const now = new Date();
    const start = new Date(now.getTime() - 7*86400000).toISOString().slice(0,10);
    const end = now.toISOString().slice(0,10);

    const donkiUrl =
      `${DONKI_CME}?startDate=${start}&endDate=${end}&mostAccurateOnly=true&speed=300&api_key=${NASA_KEY}`;

    const [donki, wind, mag, kp] = await Promise.all([
      fetchJSON(donkiUrl),
      fetchJSON(NOAA.wind).catch(()=>[]),
      fetchJSON(NOAA.mag).catch(()=>[]),
      fetchJSON(NOAA.kp).catch(()=>[])
    ]);

    const sw = parseSolarWind(wind, mag, kp);

    const cmes = donki
      .map(c => parseCME(c, sw))
      .filter(Boolean)
      .sort((a,b)=>b.arrivalScore-a.arrivalScore);

    GLOBAL.cmes = cmes;
    GLOBAL.sw = sw;
    GLOBAL.startTime = new Date();

    renderWind(sw);
    renderTable(cmes);
    updateTimeline();

    raw(JSON.stringify({
      note:"CME Earth arrival model. ENLIL arrival is used first; otherwise DBM-lite.",
      count:cmes.length,
      solarWind:sw,
      cmes:cmes.slice(0,20)
    }, null, 2));

  }catch(e){
    raw("ERROR: " + e.message);
  }
}

async function fetchJSON(url){
  const sep = url.includes("?") ? "&" : "?";
  const r = await fetch(url + sep + "t=" + Date.now());
  if(!r.ok) throw new Error("HTTP " + r.status + " : " + url);
  return await r.json();
}

function parseSolarWind(wind, mag, kp){
  const w = latest(wind);
  const b = latest(mag);
  const k = latest(kp);

  const speed = pick(w,["speed","proton_speed","bulk_speed",2]) || 400;
  const density = pick(w,["density","proton_density",1]);
  const by = pick(b,["by_gsm","by",2]);
  const bz = pick(b,["bz_gsm","bz",3]);
  const bt = pick(b,["bt","total_field",6]);
  const kpVal = pick(k,["kp_index","kp","estimated_kp",1]);

  const pdyn = density && speed ? 1.6726e-6 * density * speed * speed : 0;
  const clock = calcClockAngle(by,bz);

  return {
    time:getTime(w)||getTime(b)||getTime(k)||"",
    speed,density,by,bz,bt,kp:kpVal,
    dynamicPressure:pdyn,
    clockAngle:clock
  };
}

function latest(arr){
  if(!Array.isArray(arr)) return {};
  for(let i=arr.length-1;i>=0;i--){
    const r = arr[i];
    if(Array.isArray(r)){
      if(String(r[0]).toLowerCase().includes("time")) continue;
      return r;
    }
    if(r && typeof r === "object") return r;
  }
  return {};
}

function pick(obj,names){
  for(const n of names){
    if(typeof n === "number" && Array.isArray(obj)){
      const v = Number(obj[n]);
      if(Number.isFinite(v)) return v;
    }
    if(typeof n === "string" && obj[n] !== undefined){
      const v = Number(obj[n]);
      if(Number.isFinite(v)) return v;
    }
  }
  return 0;
}

function getTime(obj){
  if(Array.isArray(obj)) return obj[0] || "";
  if(!obj) return "";
  return obj.time_tag || obj.time || obj.observation_time || "";
}

function calcClockAngle(by,bz){
  return Math.max(0, Math.min(180, Math.atan2(Math.abs(by), bz)*180/Math.PI));
}

function parseCME(c, sw){
  if(!c.speed) return null;

  const lon = Number(c.longitude);
  const lat = Number(c.latitude);
  const speed = Number(c.speed);
  const halfAngle = Number(c.halfAngle || 20);

  if(!Number.isFinite(lon) || !Number.isFinite(lat) || !Number.isFinite(speed)){
    return null;
  }

  const t0 = c.time21_5
    ? new Date(c.time21_5)
    : new Date(c.activityStartTime || Date.now());

  const arrival = computeArrival(c, sw);
  const earthScore = earthDirectedScore(lon, lat, halfAngle);
  const speedScore = cmeSpeedScore(speed);
  const widthScore = Math.min(25, halfAngle * 0.45);
  const arrivalScore = Math.min(100, Math.round(earthScore + speedScore + widthScore));

  const durationHours = durationByWidth(halfAngle, speed);

  return {
    id:c.activityID || "CME-" + Math.random().toString(36).slice(2,7),
    catalog:c.catalog || "",
    lon,lat,speed,halfAngle,
    t0,
    arrival,
    earthScore:Math.round(earthScore),
    speedScore:Math.round(speedScore),
    widthScore:Math.round(widthScore),
    arrivalScore,
    durationHours,
    activeStart:new Date(arrival.date.getTime() - 6*3600*1000),
    activeEnd:new Date(arrival.date.getTime() + durationHours*3600*1000),
    raw:c
  };
}

function earthDirectedScore(lon, lat, half){
  const angularDistance = Math.sqrt(lon*lon + lat*lat);

  if(angularDistance <= half) return 45;
  if(angularDistance <= half + 15) return 34;
  if(angularDistance <= half + 30) return 22;
  if(angularDistance <= half + 50) return 10;
  return 2;
}

function cmeSpeedScore(speed){
  if(speed >= 2000) return 30;
  if(speed >= 1500) return 25;
  if(speed >= 1000) return 18;
  if(speed >= 700) return 11;
  if(speed >= 500) return 6;
  return 2;
}

function computeArrival(c, sw){
  const enlil = getBestEnlil(c);

  if(enlil && enlil.estimatedShockArrivalTime){
    const d = new Date(enlil.estimatedShockArrivalTime);

    return {
      source:"ENLIL",
      date:d,
      utc:d.toISOString(),
      speed:enlil.estimatedDuration || null,
      kp:enlil.estimatedKp || null,
      note:"DONKI ENLIL estimatedShockArrivalTime"
    };
  }

  const baseTime = c.time21_5
    ? new Date(c.time21_5)
    : new Date(c.activityStartTime || Date.now());

  const bg = sw.speed && sw.speed > 250 ? sw.speed : 400;

  let vEff = Number(c.speed);

  // DBM-lite: 高速CMEは背景太陽風に向かって減速
  if(vEff > bg){
    vEff = bg + (vEff - bg) * 0.62;
  }

  // 遅いCMEは背景風にやや近づく
  if(vEff < bg){
    vEff = vEff + (bg - vEff) * 0.25;
  }

  if(vEff < 320) vEff = 320;

  const hours = AU_KM / vEff / 3600;
  const d = new Date(baseTime.getTime() + hours*3600*1000);

  return {
    source:"DBM-lite",
    date:d,
    utc:d.toISOString(),
    speed:Math.round(vEff),
    kp:null,
    note:"Simple drag-based arrival estimate"
  };
}

function getBestEnlil(c){
  if(!c.enlilList || !Array.isArray(c.enlilList) || !c.enlilList.length){
    return null;
  }

  const valid = c.enlilList
    .filter(x => x && x.estimatedShockArrivalTime)
    .sort((a,b)=>{
      const ta = new Date(a.estimatedShockArrivalTime).getTime();
      const tb = new Date(b.estimatedShockArrivalTime).getTime();
      return tb - ta;
    });

  return valid[0] || null;
}

function durationByWidth(half, speed){
  let h = 12;
  if(half >= 35) h = 24;
  if(half >= 60) h = 36;
  if(half >= 90) h = 48;
  if(speed >= 1200) h += 6;
  return h;
}

function rotatedLongitude(c, displayTime){
  const hours = (displayTime - c.t0) / 3600000;
  return normalizeLon(c.lon + SOLAR_ROTATION_DEG_PER_HOUR * hours);
}

function projectSolarOrthographic(latDeg, lonDeg){
  const lat = latDeg * Math.PI/180;
  const lon = lonDeg * Math.PI/180;
  const x = Math.cos(lat) * Math.sin(lon);
  const y = -Math.sin(lat);
  const z = Math.cos(lat) * Math.cos(lon);
  return {x,y,z,visible:z > 0};
}

function updateTimeline(){
  const h = Number(document.getElementById("timeSlider").value);
  const t = new Date(GLOBAL.startTime.getTime() + h*3600*1000);

  document.getElementById("timeLabel").innerHTML =
    `<b>${t.toISOString().slice(0,16).replace("T"," ")} UTC</b> / 現在+${h}h`;

  drawSun(GLOBAL.cmes,t);
  drawEarthImpact(GLOBAL.cmes,t);
  drawFlow(GLOBAL.cmes,t);
}

function drawSun(cmes,time){
  const {ctx,w,h,cx,cy,r} = setup("sunCanvas");
  ctx.clearRect(0,0,w,h);

  const g = ctx.createRadialGradient(cx-r*.25,cy-r*.25,r*.1,cx,cy,r);
  g.addColorStop(0,"#fff59d");
  g.addColorStop(.55,"#ffb300");
  g.addColorStop(1,"#e65100");

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=g;
  ctx.fill();
  ctx.strokeStyle="#fff5";
  ctx.stroke();

  drawSolarGrid(ctx,cx,cy,r);

  ctx.fillStyle="#fff";
  ctx.font="13px system-ui";
  ctx.fillText("DONKI CME source direction",12,24);
  ctx.fillText("N",cx-4,cy-r-10);
  ctx.fillText("S",cx-4,cy+r+20);
  ctx.fillText("E",cx-r-24,cy+4);
  ctx.fillText("W",cx+r+12,cy+4);

  let visible=0, hidden=0;

  cmes.slice(0,40).forEach(c=>{
    const lon = rotatedLongitude(c,time);
    const p = projectSolarOrthographic(c.lat,lon);

    if(!p.visible){
      hidden++;
      return;
    }

    visible++;

    const x = cx + p.x*r;
    const y = cy + p.y*r;
    const col = riskColor(c.arrivalScore);
    const size = Math.max(5,Math.min(30,c.halfAngle/3));

    ctx.beginPath();
    ctx.arc(x,y,size+5,0,Math.PI*2);
    ctx.fillStyle=col+"55";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x,y,size,0,Math.PI*2);
    ctx.fillStyle=col;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x,y,Math.min(r*.35,size+c.halfAngle*.8),0,Math.PI*2);
    ctx.strokeStyle=col+"99";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";
    ctx.fillText(shortId(c.id),x+size+6,y);
  });

  document.getElementById("sunSummary").innerHTML =
    `太陽面表示: <b>${visible}</b>件 / 裏面・limb外: <b>${hidden}</b>件<br>`+
    `色 = Earth arrival score<br>`+
    `点サイズ = halfAngle<br>`+
    `太陽自転をスライダー時刻で反映`;
}

function drawEarthImpact(cmes,time){
  const {ctx,w,h,cx,cy,r} = setup("earthCanvas");
  ctx.clearRect(0,0,w,h);

  ctx.fillStyle="#07111f";
  ctx.fillRect(0,0,w,h);

  const ex = cx;
  const ey = cy;
  const er = r*0.32;

  ctx.beginPath();
  ctx.arc(ex,ey,er,0,Math.PI*2);
  ctx.fillStyle="#4fc3f7";
  ctx.fill();

  ctx.strokeStyle="#fff5";
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(ex,ey,er*2.6,0,Math.PI*2);
  ctx.strokeStyle="#ffffff22";
  ctx.stroke();

  const active = cmes.filter(c => time >= c.activeStart && time <= c.activeEnd);

  let maxRisk = 0;
  let best = null;

  active.forEach((c,i)=>{
    const dt = Math.abs(time - c.arrival.date)/3600000;
    const tw = Math.exp(-(dt*dt)/(2*12*12));
    const risk = c.arrivalScore * tw;

    if(risk > maxRisk){
      maxRisk = risk;
      best = c;
    }

    const col = riskColor(risk);
    const rr = er*1.5 + i*8;

    ctx.beginPath();
    ctx.arc(ex,ey,rr,Math.PI*1.08,Math.PI*1.92);
    ctx.strokeStyle=col;
    ctx.lineWidth=4;
    ctx.stroke();
  });

  ctx.fillStyle="#fff";
  ctx.font="13px system-ui";
  ctx.fillText("Earth arrival / shock window",12,24);
  ctx.fillText(`Active CME windows: ${active.length}`,12,h*0.72);
  ctx.fillText(`Max arrival risk: ${Math.round(maxRisk)}`,12,h*0.78);

  if(best){
    ctx.fillText(`Top: ${shortId(best.id)} / ${best.arrival.source}`,12,h*0.84);
    ctx.fillText(`Arrival: ${best.arrival.utc.slice(0,16).replace("T"," ")}`,12,h*0.90);
  }

  document.getElementById("earthSummary").innerHTML =
    `影響中CME: <b>${active.length}</b><br>`+
    `最大到達リスク: <b style="color:${riskColor(maxRisk)}">${Math.round(maxRisk)}</b><br>`+
    `到達時刻は ENLIL があれば優先、なければ DBM-lite`;
}

function drawFlow(cmes,time){
  const {ctx,w,h} = setupWide("flowCanvas");
  ctx.clearRect(0,0,w,h);

  const sx=70, ex=w-80, y=h/2, len=ex-sx;

  ctx.strokeStyle="#ffffff22";
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.moveTo(sx,y);
  ctx.lineTo(ex,y);
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(sx,y,28,0,Math.PI*2);
  ctx.fillStyle="#ffb300";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(ex,y,14,0,Math.PI*2);
  ctx.fillStyle="#4fc3f7";
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.font="12px system-ui";
  ctx.fillText("Sun",sx-12,y+48);
  ctx.fillText("Earth",ex-20,y+38);
  ctx.fillText("CME plasma propagation to Earth",12,24);

  let drawn = 0;

  cmes.slice(0,15).forEach((c,idx)=>{
    const total = c.arrival.date - c.t0;
    const elapsed = time - c.t0;

    if(total <= 0) return;

    const frac = elapsed / total;

    if(frac < -0.05 || frac > 1.25) return;

    drawn++;

    const clamped = Math.max(0,Math.min(1.15,frac));
    const x = sx + clamped*len;
    const lane = y - 70 + (idx%7)*24;
    const col = riskColor(c.arrivalScore);

    ctx.strokeStyle=col;
    ctx.lineWidth=Math.max(2,Math.min(18,c.halfAngle/4));
    ctx.globalAlpha=0.75;

    ctx.beginPath();
    ctx.arc(x,lane,22+c.halfAngle*0.7,-0.95,0.95);
    ctx.stroke();

    ctx.globalAlpha=1;

    ctx.fillStyle=col;
    ctx.beginPath();
    ctx.arc(x,lane,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";

    const pct = Math.round(clamped*100);
    ctx.fillText(`${shortId(c.id)} ${pct}%`,x+8,lane-8);

    if(Math.abs(frac-1) < 0.06){
      ctx.fillStyle="#ff1744";
      ctx.fillText("ARRIVAL",ex-60,lane-8);
    }
  });

  ctx.fillStyle="#bbb";
  ctx.font="12px system-ui";
  ctx.fillText(`Displayed CME fronts: ${drawn}`,12,h-18);
}

function drawSolarGrid(ctx,cx,cy,r){
  ctx.strokeStyle="rgba(255,255,255,0.16)";
  ctx.lineWidth=1;

  [-60,-30,0,30,60].forEach(lat=>{
    ctx.beginPath();
    for(let lon=-90; lon<=90; lon+=2){
      const p = projectSolarOrthographic(lat,lon);
      const x = cx + p.x*r;
      const y = cy + p.y*r;
      if(lon === -90) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  });

  [-60,-30,0,30,60].forEach(lon=>{
    ctx.beginPath();
    for(let lat=-89; lat<=89; lat+=2){
      const p = projectSolarOrthographic(lat,lon);
      const x = cx + p.x*r;
      const y = cy + p.y*r;
      if(lat === -89) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }
    ctx.stroke();
  });
}

function renderWind(sw){
  document.getElementById("windBox").innerHTML =
    `Time: <b>${sw.time || "不明"}</b><br>`+
    `Speed: <b>${sw.speed}</b> km/s<br>`+
    `Density: <b>${sw.density}</b> p/cm³<br>`+
    `Bt=${sw.bt} nT / By=${sw.by} nT / Bz=${sw.bz} nT<br>`+
    `IMF clock angle: <b>${sw.clockAngle.toFixed(1)}°</b><br>`+
    `Dynamic pressure: <b>${sw.dynamicPressure.toFixed(2)}</b> nPa<br>`+
    `Kp: <b>${sw.kp}</b>`;
}

function renderTable(cmes){
  document.getElementById("table").innerHTML =
  `<table>
  <tr>
    <th>ID</th><th>Lon</th><th>Lat</th><th>Speed</th><th>Half</th>
    <th>Earth</th><th>ArrivalScore</th><th>Arrival</th><th>Source</th>
  </tr>
  ${
    cmes.map(c=>`
    <tr>
      <td>${c.id}</td>
      <td>${c.lon}</td>
      <td>${c.lat}</td>
      <td>${c.speed}</td>
      <td>${c.halfAngle}</td>
      <td>${c.earthScore}</td>
      <td style="color:${riskColor(c.arrivalScore)};font-weight:700">${c.arrivalScore}</td>
      <td>${c.arrival.utc.slice(0,16).replace("T"," ")}</td>
      <td>${c.arrival.source}</td>
    </tr>
    `).join("")
  }
  </table>`;
}

function setup(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();

  c.width = rect.width*dpr;
  c.height = rect.height*dpr;

  const ctx = c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  return {
    ctx,
    w:rect.width,
    h:rect.height,
    cx:rect.width/2,
    cy:rect.height/2,
    r:Math.min(rect.width,rect.height)*0.38
  };
}

function setupWide(id){
  const c = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const rect = c.getBoundingClientRect();

  c.width = rect.width*dpr;
  c.height = rect.height*dpr;

  const ctx = c.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);

  return {ctx,w:rect.width,h:rect.height};
}

function normalizeLon(lon){
  while(lon>180) lon-=360;
  while(lon<-180) lon+=360;
  return lon;
}

function riskColor(s){
  if(s>=80) return "#ff1744";
  if(s>=60) return "#ff9100";
  if(s>=35) return "#ffee58";
  return "#8bc34a";
}

function shortId(id){
  const s = String(id || "CME");
  if(s.includes("CME")){
    return "CME" + s.split("CME").pop().replace(/[^0-9]/g,"").slice(-4);
  }
  return s.slice(-6);
}

function playTimeline(){
  stopTimeline();
  GLOBAL.timer = setInterval(()=>{
    const s = document.getElementById("timeSlider");
    let v = Number(s.value)+1;
    if(v>168) v=0;
    s.value=v;
    updateTimeline();
  },300);
}

function stopTimeline(){
  if(GLOBAL.timer) clearInterval(GLOBAL.timer);
  GLOBAL.timer=null;
}

loadAll();
</script>
</body>
</html>
