<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DONKI CME GEO Risk System</title>

<style>
body{
  margin:0;
  background:#070b12;
  color:#eee;
  font-family:system-ui,sans-serif;
}

header{
  background:#101826;
  border-bottom:1px solid #333;
  padding:16px;
}

button{
  padding:10px 14px;
  border:0;
  border-radius:8px;
  background:#1e88e5;
  color:#fff;
  cursor:pointer;
  margin-right:8px;
  font-weight:700;
}

main{
  padding:16px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(420px,1fr));
  gap:16px;
}

.card{
  background:#141b28;
  border:1px solid #333;
  border-radius:14px;
  padding:14px;
}

.box{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

.widebox{
  position:relative;
  width:100%;
  height:260px;
  background:#000;
  border-radius:12px;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}

input[type=range]{
  width:100%;
}

pre{
  background:#050608;
  border-radius:10px;
  padding:10px;
  overflow:auto;
  max-height:300px;
  white-space:pre-wrap;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}

td,th{
  border-bottom:1px solid #333;
  padding:6px;
  text-align:left;
}

.small{
  color:#bbb;
  font-size:13px;
  line-height:1.5;
}
</style>
</head>

<body>

<header>
<h2>DONKI CME → GEO Longitude Risk System</h2>

<button onclick="loadAll()">
DONKI + NOAA取得
</button>

<button onclick="playTimeline()">▶ 再生</button>
<button onclick="stopTimeline()">停止</button>
</header>

<main>

<div class="grid">

<section class="card">
<h3>① DONKI CME 現況</h3>

<div class="box">
<canvas id="sunCanvas"></canvas>
</div>

<div id="sunInfo" class="small">
未取得
</div>
</section>

<section class="card">
<h3>② GEO経度別リスク</h3>

<div class="box">
<canvas id="geoCanvas"></canvas>
</div>

<div id="geoInfo" class="small">
未取得
</div>
</section>

</div>

<section class="card" style="margin-top:16px">
<h3>③ 太陽→地球 CME伝播</h3>

<input
id="timeSlider"
type="range"
min="0"
max="168"
value="0"
step="1"
oninput="updateTimeline()">

<div id="timeLabel" class="small"></div>

<div class="widebox">
<canvas id="flowCanvas"></canvas>
</div>

</section>

<section class="card" style="margin-top:16px">
<h3>④ NOAA RTSW 現況</h3>

<div id="swInfo" class="small">
未取得
</div>
</section>

<section class="card" style="margin-top:16px">
<h3>⑤ CME一覧</h3>
<div id="table"></div>
</section>

<section class="card" style="margin-top:16px">
<h3>Status</h3>
<pre id="raw">未取得</pre>
</section>

</main>

<script>

const NASA_KEY = "DEMO_KEY";

const DONKI =
`https://api.nasa.gov/DONKI/CMEAnalysis
?startDate=${dateDaysAgo(5)}
&endDate=${dateToday()}
&mostAccurateOnly=true
&speed=500
&halfAngle=20
&catalog=ALL
&api_key=${NASA_KEY}`.replace(/\s+/g,'');

const NOAA = {
  wind:"https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json",
  mag:"https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json",
  kp:"https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
};

let GLOBAL = {
  cmes:[],
  sw:{},
  startTime:new Date(),
  timer:null
};

function dateToday(){
  return new Date().toISOString().slice(0,10);
}

function dateDaysAgo(d){
  const t=new Date(Date.now()-d*86400000);
  return t.toISOString().slice(0,10);
}

async function loadAll(){

  try{

    raw("DONKI取得中...");

    const [donki, wind, mag, kp] = await Promise.all([
      fetchJson(DONKI),
      fetchJson(NOAA.wind).catch(()=>[]),
      fetchJson(NOAA.mag).catch(()=>[]),
      fetchJson(NOAA.kp).catch(()=>[])
    ]);

    const sw = parseSolarWind(wind,mag,kp);

    GLOBAL.sw = sw;

    GLOBAL.cmes =
      donki
      .map(c => normalizeDONKI(c,sw))
      .sort((a,b)=>b.impactScore-a.impactScore);

    drawSun(GLOBAL.cmes);

    renderSolarWind(sw);

    renderTable(GLOBAL.cmes);

    updateTimeline();

    raw(JSON.stringify({
      cmeCount:GLOBAL.cmes.length,
      solarWind:sw,
      topCmes:GLOBAL.cmes.slice(0,10)
    },null,2));

  }catch(e){

    raw("ERROR: "+e.message);

  }

}

async function fetchJson(url){

  const r = await fetch(url+"&t="+Date.now());

  if(!r.ok)
    throw new Error("HTTP "+r.status);

  return await r.json();

}

function parseSolarWind(wind,mag,kp){

  const w = wind.at(-1) || {};
  const b = mag.at(-1) || {};
  const k = kp.at(-1) || {};

  const speed =
    Number(w.proton_speed || w.speed || 400);

  const density =
    Number(w.proton_density || w.density || 5);

  const by =
    Number(b.by_gsm || b.by || 0);

  const bz =
    Number(b.bz_gsm || b.bz || 0);

  const bt =
    Number(b.bt || 5);

  const kpVal =
    Number(k.kp_index || k.kp || 2);

  const pdyn =
    1.6726e-6 * density * speed * speed;

  const clock =
    calcClockAngle(by,bz);

  const coupling =
    calcCoupling(speed,bt,by,bz);

  return {
    speed,density,by,bz,bt,
    kp:kpVal,
    dynamicPressure:pdyn,
    clockAngle:clock,
    coupling
  };
}

function calcClockAngle(by,bz){

  return Math.max(
    0,
    Math.min(
      180,
      Math.atan2(Math.abs(by),bz)*180/Math.PI
    )
  );

}

function calcCoupling(speed,bt,by,bz){

  const theta =
    calcClockAngle(by,bz)*Math.PI/180;

  return Math.round(
    speed *
    Math.max(0,bt) *
    Math.pow(Math.sin(theta/2),4)
  );

}

function normalizeDONKI(c,sw){

  const lon = Number(c.longitude || 0);
  const lat = Number(c.latitude || 0);
  const speed = Number(c.speed || 500);
  const halfAngle = Number(c.halfAngle || 30);

  const earthDirected =
    Math.abs(lon) < 40
    ? 1
    : Math.abs(lon) < 70
    ? 0.6
    : 0.2;

  const widthScore =
    Math.min(30,halfAngle);

  const speedScore =
    speed>=2000 ? 40 :
    speed>=1500 ? 32 :
    speed>=1000 ? 24 :
    speed>=700 ? 16 :
    8;

  const earthScore =
    earthDirected * 35;

  const clockScore =
    sw.clockAngle>=150 ? 20 :
    sw.clockAngle>=135 ? 14 :
    sw.clockAngle>=120 ? 8 :
    0;

  const pressureScore =
    sw.dynamicPressure>=8 ? 14 :
    sw.dynamicPressure>=4 ? 8 :
    0;

  const kpScore =
    sw.kp>=6 ? 15 :
    sw.kp>=5 ? 8 :
    0;

  const couplingScore =
    sw.coupling>=8000 ? 14 :
    sw.coupling>=4000 ? 8 :
    0;

  const impactScore = Math.min(
    100,
    Math.round(
      widthScore+
      speedScore+
      earthScore+
      clockScore+
      pressureScore+
      kpScore+
      couplingScore
    )
  );

  const arrival =
    estimateArrival(c,sw);

  return {
    ...c,
    lon,
    lat,
    speed,
    halfAngle,
    impactScore,
    arrival,
    activeStart:
      new Date(arrival.date.getTime()-6*3600*1000),
    activeEnd:
      new Date(arrival.date.getTime()+36*3600*1000)
  };

}

function estimateArrival(c,sw){

  if(
    c.enlilList &&
    c.enlilList.length &&
    c.enlilList[0].estimatedShockArrivalTime
  ){

    const d =
      new Date(
        c.enlilList[0].estimatedShockArrivalTime
      );

    return {
      source:"ENLIL",
      date:d,
      utc:d.toISOString()
    };

  }

  const speed = Number(c.speed || 500);

  const bg =
    sw.speed>250 ? sw.speed : 400;

  let vEff = speed;

  if(speed>bg)
    vEff = bg + (speed-bg)*0.62;

  const hours =
    149597870 / vEff / 3600;

  const t0 =
    new Date(c.time21_5);

  const d =
    new Date(
      t0.getTime() + hours*3600*1000
    );

  return {
    source:"DBM",
    date:d,
    utc:d.toISOString()
  };

}

function drawSun(cmes){

  const {ctx,w,h,cx,cy,r} =
    setup("sunCanvas");

  ctx.clearRect(0,0,w,h);

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle="#ffb300";
  ctx.fill();

  ctx.strokeStyle="#fff5";
  ctx.stroke();

  ctx.fillStyle="#fff";
  ctx.font="13px system-ui";
  ctx.fillText(
    "DONKI CMEAnalysis",
    12,22
  );

  cmes.slice(0,15).forEach(c=>{

    const x =
      cx + (c.lon/90)*r;

    const y =
      cy - (c.lat/90)*r;

    const col =
      riskColor(c.impactScore);

    ctx.fillStyle=col;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      Math.max(4,c.halfAngle*0.35),
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";

    ctx.fillText(
      "CME",
      x+8,
      y
    );

  });

  document.getElementById("sunInfo").innerHTML =
    `DONKI CME数: <b>${cmes.length}</b><br>`+
    `円サイズ=halfAngle<br>`+
    `色=Impact Score<br>`+
    `位置=longitude/latitude`;

}

function updateTimeline(){

  const h =
    Number(
      document.getElementById("timeSlider").value
    );

  const time =
    new Date(
      GLOBAL.startTime.getTime()+h*3600*1000
    );

  document.getElementById("timeLabel").innerHTML =
    `<b>${time.toISOString().slice(0,16).replace("T"," ")}</b> UTC`;

  drawGEO(time);

  drawFlow(time);

}

function drawGEO(time){

  const {ctx,w,h} =
    setup("geoCanvas");

  ctx.clearRect(0,0,w,h);

  const active =
    GLOBAL.cmes.filter(
      c=>time>=c.activeStart && time<=c.activeEnd
    );

  const center =
    subsolarLongitude(time);

  for(let i=0;i<360;i++){

    const lon = -180+i;

    let risk = 0;

    for(const c of active){

      const dt =
        Math.abs(time-c.arrival.date)/3600000;

      const timeWeight =
        Math.exp(-(dt*dt)/(2*18*18));

      const compression =
        Math.exp(
          -(angDist(lon,center)**2)/(2*55*55)
        );

      const dusk =
        Math.exp(
          -(angDist(
            lon,
            normalizeLon(center-90)
          )**2)/(2*70*70)
        );

      let r =
        c.impactScore *
        timeWeight *
        compression;

      if(GLOBAL.sw.clockAngle>=120)
        r +=
          c.impactScore *
          0.45 *
          dusk;

      risk = Math.max(risk,r);

    }

    ctx.fillStyle =
      riskColor(risk);

    ctx.fillRect(
      i*w/360,
      h*0.22,
      w/360+1,
      h*0.28
    );

  }

  drawGeoAxis(ctx,w,h);

  document.getElementById("geoInfo").innerHTML =
    `影響中CME: <b>${active.length}</b><br>`+
    `Clock angle: <b>${GLOBAL.sw.clockAngle.toFixed(1)}°</b><br>`+
    `Bz: <b>${GLOBAL.sw.bz}</b> nT`;

}

function drawFlow(time){

  const c =
    document.getElementById("flowCanvas");

  const dpr =
    window.devicePixelRatio||1;

  const rect =
    c.getBoundingClientRect();

  c.width = rect.width*dpr;
  c.height = rect.height*dpr;

  const ctx =
    c.getContext("2d");

  ctx.setTransform(dpr,0,0,dpr,0,0);

  const w = rect.width;
  const h = rect.height;

  const sunX = 70;
  const earthX = w-80;
  const y = h/2;

  ctx.clearRect(0,0,w,h);

  ctx.beginPath();
  ctx.moveTo(sunX,y);
  ctx.lineTo(earthX,y);

  ctx.strokeStyle="#ffffff22";
  ctx.lineWidth=2;
  ctx.stroke();

  ctx.beginPath();
  ctx.arc(sunX,y,28,0,Math.PI*2);
  ctx.fillStyle="#ffb300";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(earthX,y,14,0,Math.PI*2);
  ctx.fillStyle="#4fc3f7";
  ctx.fill();

  GLOBAL.cmes.slice(0,10).forEach(c=>{

    const t0 =
      new Date(c.time21_5);

    const total =
      c.arrival.date - t0;

    const elapsed =
      time - t0;

    const frac =
      Math.max(
        0,
        Math.min(1.15, elapsed/total)
      );

    if(frac<=0 || frac>1.12)
      return;

    const x =
      sunX + frac*(earthX-sunX);

    const col =
      riskColor(c.impactScore);

    ctx.strokeStyle=col;
    ctx.lineWidth=
      Math.max(2,c.halfAngle*0.3);

    ctx.globalAlpha=0.7;

    ctx.beginPath();

    ctx.arc(
      x,
      y,
      25+c.halfAngle*0.6,
      -0.9,
      0.9
    );

    ctx.stroke();

    ctx.globalAlpha=1;

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";

    ctx.fillText(
      `${Math.round(frac*100)}%`,
      x+8,
      y-24
    );

  });

}

function renderSolarWind(sw){

  document.getElementById("swInfo").innerHTML =
    `Solar wind speed: <b>${sw.speed}</b> km/s<br>`+
    `Density: <b>${sw.density}</b> p/cm³<br>`+
    `By: <b>${sw.by}</b> nT<br>`+
    `Bz: <b>${sw.bz}</b> nT<br>`+
    `Bt: <b>${sw.bt}</b> nT<br>`+
    `Clock angle: <b>${sw.clockAngle.toFixed(1)}°</b><br>`+
    `Coupling: <b>${sw.coupling}</b><br>`+
    `Dynamic Pressure: <b>${sw.dynamicPressure.toFixed(2)}</b> nPa<br>`+
    `Kp: <b>${sw.kp}</b>`;

}

function renderTable(cmes){

  document.getElementById("table").innerHTML = `
  <table>
  <tr>
  <th>Time</th>
  <th>Lon</th>
  <th>Lat</th>
  <th>Speed</th>
  <th>HalfAngle</th>
  <th>Arrival</th>
  <th>Method</th>
  <th>Impact</th>
  </tr>

  ${cmes.map(c=>`

  <tr>
  <td>${c.time21_5 || "-"}</td>
  <td>${c.lon}</td>
  <td>${c.lat}</td>
  <td>${c.speed}</td>
  <td>${c.halfAngle}</td>
  <td>${c.arrival.utc.slice(0,16).replace("T"," ")}</td>
  <td>${c.arrival.source}</td>
  <td style="color:${riskColor(c.impactScore)};font-weight:700">
  ${c.impactScore}
  </td>
  </tr>

  `).join("")}

  </table>
  `;

}

function setup(id){

  const c =
    document.getElementById(id);

  const dpr =
    window.devicePixelRatio||1;

  const rect =
    c.getBoundingClientRect();

  c.width = rect.width*dpr;
  c.height = rect.height*dpr;

  const ctx =
    c.getContext("2d");

  ctx.setTransform(dpr,0,0,dpr,0,0);

  return {
    ctx,
    w:rect.width,
    h:rect.height,
    cx:rect.width/2,
    cy:rect.height/2,
    r:Math.min(rect.width,rect.height)*0.38
  };

}

function drawGeoAxis(ctx,w,h){

  [-180,-120,-60,0,60,120,180]
  .forEach(lon=>{

    const x =
      (lon+180)/360*w;

    ctx.strokeStyle="#fff5";

    ctx.beginPath();
    ctx.moveTo(x,h*0.18);
    ctx.lineTo(x,h*0.55);
    ctx.stroke();

    ctx.fillStyle="#fff";
    ctx.font="11px system-ui";

    ctx.fillText(
      lon+"°",
      x+2,
      h*0.18
    );

  });

}

function subsolarLongitude(date){

  const h =
    date.getUTCHours() +
    date.getUTCMinutes()/60;

  let lon =
    180 - h*15;

  while(lon>180) lon-=360;
  while(lon<-180) lon+=360;

  return lon;

}

function normalizeLon(lon){

  while(lon>180) lon-=360;
  while(lon<-180) lon+=360;

  return lon;

}

function angDist(a,b){

  return Math.abs(
    ((a-b+180)%360+360)%360-180
  );

}

function riskColor(s){

  if(s>=75) return "#ff1744";
  if(s>=55) return "#ff9100";
  if(s>=30) return "#ffee58";

  return "#8bc34a";

}

function playTimeline(){

  stopTimeline();

  GLOBAL.timer =
    setInterval(()=>{

      const s =
        document.getElementById("timeSlider");

      let v =
        Number(s.value)+1;

      if(v>168) v=0;

      s.value=v;

      updateTimeline();

    },300);

}

function stopTimeline(){

  if(GLOBAL.timer)
    clearInterval(GLOBAL.timer);

  GLOBAL.timer=null;

}

function raw(t){

  document.getElementById("raw").textContent=t;

}

loadAll();

</script>

</body>
</html>
